# Main model: full ρ grid {0, 0.25, 0.5, 0.75, 1} × 3 seeds + baselines.
model:
  name: qwen3-4b
  hf_id: Qwen/Qwen3-4B                    # post-trained (not -Base)
  path: null                              # local snapshot; set to skip the hub (e.g. $SCRATCH/models/Qwen3-4B)
  chat_template_kwargs: {enable_thinking: false}
  eot_token: "<|im_end|>"
train:
  micro_quartets: 4                       # 16 sequences per forward; 8 ran out of memory without checkpointing (2026-11-25)
  gradient_checkpointing: false           # 2026-11-25: on = 13.8 GB at micro 8 (5.2 s/step); off + micro 8 = OOM (39.5 GB)
eval:
  batch_quartets: 32                      # forward-only; must match the reference cache (reference.py uses this too)
