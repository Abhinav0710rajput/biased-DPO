# Main model: full ρ grid {0, 0.25, 0.5, 0.75, 1} × 3 seeds + baselines.
model:
  name: qwen3-4b
  hf_id: Qwen/Qwen3-4B                    # post-trained (not -Base)
  path: null                              # local snapshot; set to skip the hub (e.g. $SCRATCH/models/Qwen3-4B)
  chat_template_kwargs: {enable_thinking: false}
  eot_token: "<|im_end|>"
train:
  lr: 5.0e-6                              # LR sweep 2026-11-25 (results/qwen3-4b/lr_sweep.json): all three tied on val
                                          # pairwise acc (0.994–0.995); 5e-6 lowest val loss. Frozen for every 4B run.
  micro_quartets: 8                      # 32 sequences per forward
  gradient_checkpointing: true            # 2026-11-25 on an A100-40GB: on + micro 8 = 13.8 GB, 5.2 s/step (smoke test);
                                          # off ran out of memory even at micro 4 (fp32 LoRA input copies per layer)
eval:
  batch_quartets: 32                      # forward-only; must match the reference cache (reference.py uses this too)
